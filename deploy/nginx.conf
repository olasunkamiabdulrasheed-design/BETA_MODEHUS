# BETA_MODEHUS — nginx site config
# Install to /etc/nginx/sites-available/betamodehus and link from sites-enabled.
# Serve the built React app from frontend/dist and proxy the API to gunicorn.

server {
    listen 80;
    server_name api.betamodehus.com betamodehus.com www.betamodehus.com;

    # Upload limit for admin image uploads (product photos).
    client_max_body_size 25M;

    root /var/www/betamodehus/frontend/dist;
    index index.html;

    # SPA fallback — let React handle client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-lived static assets.
    location ~* \.(?:js|css|png|jpg|jpeg|webp|svg|woff2?|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Django API.
    location /api/ {
        proxy_pass http://unix:/run/betamodehus.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django admin + health.
    location /vault/ {
        proxy_pass http://unix:/run/betamodehus.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health/ {
        proxy_pass http://unix:/run/betamodehus.sock;
        proxy_set_header Host $host;
    }

    # Static files collected by `manage.py collectstatic`
    # (if not using Cloudinary for static files).
    location /static/ {
        alias /var/www/betamodehus/backend/staticfiles/;
    }

    # Media uploads (fallback when Cloudinary storage is not enabled).
    location /media/ {
        alias /var/www/betamodehus/backend/media/;
    }
}